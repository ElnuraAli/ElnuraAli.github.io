<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;
       font-family:Poppins,"Helvetica Neue",Arial,sans-serif;
       background:hsl(0,0%,7%);color:hsl(0,0%,98%);
       display:flex;align-items:center;justify-content:center}
  .card{width:1104px;height:534px;border-radius:28px;padding:64px 72px;
        background:linear-gradient(to bottom right,hsl(240,1%,17%) 0%,hsla(240,1%,18%,0) 60%),hsl(240,2%,12%);
        border:1px solid hsl(0,0%,22%);
        display:flex;flex-direction:column;justify-content:space-between}
  .kicker{font-size:22px;letter-spacing:.22em;text-transform:uppercase;
          color:hsl(45,100%,72%);font-weight:500}
  h1{font-size:92px;line-height:1;font-weight:600;letter-spacing:-.02em;margin:26px 0 18px}
  .role{font-size:38px;font-weight:300;color:hsl(0,0%,84%)}
  .stack{font-size:30px;font-weight:400;color:hsl(45,54%,58%);margin-top:14px}
  .facts{display:flex;gap:56px;border-top:1px solid hsl(0,0%,22%);padding-top:30px}
  .fact b{display:block;font-size:34px;font-weight:600;color:hsl(45,100%,72%)}
  .fact span{font-size:21px;color:hsl(0,0%,66%);font-weight:300}
</style></head>
<body>
  <div class="card">
    <div>
      <div class="kicker">elnuraali.github.io</div>
      <h1>Elnura Alieva</h1>
      <div class="role">DevOps Engineer</div>
      <div class="stack">AWS · Kubernetes · GitOps · Agentic AI</div>
    </div>
    <div class="facts">
      <div class="fact"><b>9</b><span>EKS clusters, fintech</span></div>
      <div class="fact"><b>Kafka on EKS</b><span>Strimzi, delivered by ArgoCD</span></div>
      <div class="fact"><b>Claude Code</b><span>agents built for real infra</span></div>
    </div>
  </div>
</body></html>
